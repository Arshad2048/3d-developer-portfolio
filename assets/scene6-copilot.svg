<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="copilotShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241d2b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#241d2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copilotBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D9CC"/>
      <stop offset="100%" stop-color="#C5B8A5"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="softGlow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="480" rx="320" ry="90" fill="url(#copilotShadow)" />

  <g transform="translate(0, -20)">
    <!-- Base Platform -->
    <path d="M 160 380 L 400 490 L 640 380 L 640 410 L 400 520 L 160 410 Z" fill="#B3A48F" />
    <polygon points="400,270 640,380 400,490 160,380" fill="url(#copilotBase)" />

    <!-- Isometric Circular Launchpad Base -->
    <ellipse cx="400" cy="380" rx="140" ry="60" fill="#ECE5D8" stroke="#6366F1" stroke-width="2" stroke-dasharray="8,6" />
    <ellipse cx="400" cy="380" rx="90" ry="38" fill="#DFD6C7" />

    <!-- Holographic AI Assistant Core Sphere (Center) -->
    <g transform="translate(400, 220)">
      <!-- Pulsing Rings -->
      <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="#EC4899" stroke-width="3" opacity="0.6" />
      <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="#6366F1" stroke-width="3" opacity="0.6" transform="rotate(45)" />
      <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="#06B6D4" stroke-width="3" opacity="0.6" transform="rotate(-45)" />

      <!-- Glowing AI Avatar Orb -->
      <circle cx="0" cy="0" r="32" fill="url(#avatarGlow)" filter="url(#softGlow6)" />
      <circle cx="0" cy="0" r="28" fill="#4F46E5" />
      <!-- Friendly AI Robot Face -->
      <circle cx="-9" cy="-4" r="4" fill="#38BDF8" />
      <circle cx="9" cy="-4" r="4" fill="#38BDF8" />
      <path d="M -8 10 Q 0 16 8 10" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Communication Satellite Antenna (Left) -->
    <g transform="translate(240, 270)">
      <polygon points="20,0 40,10 40,60 20,50" fill="#475569" />
      <polygon points="20,0 0,10 0,60 20,50" fill="#64748B" />
      <!-- Dish -->
      <ellipse cx="20" cy="-10" rx="26" ry="12" fill="#E2E8F0" stroke="#3B82F6" stroke-width="2" transform="rotate(-25 20 -10)" />
      <circle cx="20" cy="-10" r="5" fill="#EF4444" />
      <line x1="20" y1="-10" x2="60" y2="-40" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
    </g>

    <!-- Contact & Hire Rocket Beacon (Right) -->
    <g transform="translate(560, 250)">
      <!-- Rocket Body -->
      <polygon points="0,-40 12,0 0,20 -12,0" fill="#F8FAFC" />
      <polygon points="0,-40 12,0 0,20" fill="#E2E8F0" />
      <polygon points="0,-40 12,-15 0,-5 -12,-15" fill="#EF4444" />
      <!-- Thruster Flame -->
      <polygon points="-6,20 6,20 0,42" fill="#F59E0B" />
      <polygon points="-3,20 3,20 0,32" fill="#EF4444" />
      <text x="0" y="65" font-family="monospace" font-size="9" font-weight="bold" fill="#047857" text-anchor="middle">HIRE ME</text>
    </g>

    <!-- Connection Gateway Arc -->
    <path d="M 280 390 Q 400 330 520 390" stroke="#06B6D4" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6,4" />
  </g>
</svg>
