<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="aiShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241d2b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#241d2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aiBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D9CC"/>
      <stop offset="100%" stop-color="#C5B8A5"/>
    </linearGradient>
    <linearGradient id="pythonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="pythonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="softGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="480" rx="320" ry="90" fill="url(#aiShadow)" />

  <g transform="translate(0, -20)">
    <!-- Base Platform -->
    <path d="M 160 380 L 400 490 L 640 380 L 640 410 L 400 520 L 160 410 Z" fill="#B3A48F" />
    <polygon points="400,270 640,380 400,490 160,380" fill="url(#aiBase)" />

    <!-- Python Robotic Arm Assembly (Left) -->
    <!-- Base Turntable -->
    <ellipse cx="280" cy="360" rx="30" ry="15" fill="#334155" />
    <polygon points="270,355 290,355 310,290 290,290" fill="url(#pythonBlue)" />
    <!-- Joint Elbow -->
    <circle cx="300" cy="290" r="14" fill="#F59E0B" />
    <polygon points="300,290 320,290 380,240 360,240" fill="url(#pythonYellow)" />
    <!-- Robotic Claw -->
    <circle cx="370" cy="240" r="10" fill="#475569" />
    <path d="M 365 235 L 390 230 M 365 245 L 390 250" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />

    <!-- Central Neural Brain Matrix Network (Center) -->
    <g transform="translate(420, 260)">
      <!-- Neural Lines -->
      <line x1="-40" y1="-30" x2="20" y2="-50" stroke="#F97316" stroke-width="3" opacity="0.8"/>
      <line x1="-40" y1="-30" x2="0" y2="10" stroke="#6366F1" stroke-width="3" opacity="0.8"/>
      <line x1="20" y1="-50" x2="60" y2="-10" stroke="#06B6D4" stroke-width="3" opacity="0.8"/>
      <line x1="0" y1="10" x2="60" y2="-10" stroke="#10B981" stroke-width="3" opacity="0.8"/>
      <line x1="0" y1="10" x2="40" y2="50" stroke="#EC4899" stroke-width="3" opacity="0.8"/>
      <line x1="60" y1="-10" x2="40" y2="50" stroke="#8B5CF6" stroke-width="3" opacity="0.8"/>

      <!-- Neural Synapse Nodes -->
      <circle cx="-40" cy="-30" r="12" fill="#F97316" filter="url(#softGlow3)" />
      <circle cx="20" cy="-50" r="14" fill="#06B6D4" filter="url(#softGlow3)" />
      <circle cx="0" cy="10" r="16" fill="#6366F1" filter="url(#softGlow3)" />
      <circle cx="60" cy="-10" r="13" fill="#10B981" filter="url(#softGlow3)" />
      <circle cx="40" cy="50" r="12" fill="#EC4899" filter="url(#softGlow3)" />
    </g>

    <!-- Floating Chatbot Speech Prisms (Right) -->
    <!-- Bot Message Bubble 1 -->
    <g transform="translate(540, 240)">
      <rect x="-40" y="-20" width="80" height="40" rx="12" fill="#3B82F6" />
      <polygon points="10,20 20,20 15,30" fill="#3B82F6" />
      <circle cx="-20" cy="0" r="4" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
      <circle cx="20" cy="0" r="4" fill="#FFFFFF" />
    </g>
    <!-- Bot Message Bubble 2 (AI Response) -->
    <g transform="translate(500, 320)">
      <rect x="-50" y="-18" width="100" height="36" rx="10" fill="#10B981" />
      <polygon points="-20,18 -10,18 -15,28" fill="#10B981" />
      <line x1="-32" y1="-4" x2="25" y2="-4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="-32" y1="4" x2="10" y2="4" stroke="#D1FAE5" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Automation Webhook Router Pedestal -->
    <polygon points="340,360 400,390 400,440 340,410" fill="#475569" />
    <polygon points="340,360 280,390 280,440 340,410" fill="#334155" />
    <polygon points="340,360 400,390 340,420 280,390" fill="#64748B" />
    <text x="340" y="405" font-family="monospace" font-size="10" font-weight="bold" fill="#F8FAFC" text-anchor="middle">WEBHOOKS</text>
  </g>
</svg>
