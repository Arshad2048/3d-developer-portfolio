<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="dataShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241d2b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#241d2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dataBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D9CC"/>
      <stop offset="100%" stop-color="#C5B8A5"/>
    </linearGradient>
    <linearGradient id="supaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ECF8E"/>
      <stop offset="100%" stop-color="#1B9A59"/>
    </linearGradient>
    <linearGradient id="sqlBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="softGlow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="480" rx="320" ry="90" fill="url(#dataShadow)" />

  <g transform="translate(0, -20)">
    <!-- Base Platform -->
    <path d="M 160 380 L 400 490 L 640 380 L 640 410 L 400 520 L 160 410 Z" fill="#B3A48F" />
    <polygon points="400,270 640,380 400,490 160,380" fill="url(#dataBase)" />

    <!-- Isometric Relational Database Schema Grid (Floor Grid) -->
    <polygon points="400,310 560,385 400,460 240,385" fill="#DFD7C7" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Supabase Green Glass Pillar 1 (Left) -->
    <g transform="translate(260, 240)">
      <polygon points="40,0 80,20 80,100 40,80" fill="#1B9A59" opacity="0.9" />
      <polygon points="40,0 0,20 0,100 40,80" fill="#3ECF8E" opacity="0.9" />
      <polygon points="40,0 80,20 40,40 0,20" fill="#6EE7B7" />
      <circle cx="40" cy="50" r="10" fill="#FFFFFF" opacity="0.8" />
      <text x="40" y="75" font-family="monospace" font-size="9" font-weight="bold" fill="#064E3B" text-anchor="middle">AUTH</text>
    </g>

    <!-- PostgreSQL / SQL Central Vault Tower (Center) -->
    <g transform="translate(360, 180)">
      <!-- Cylinder / Hex Pillar 1 -->
      <polygon points="40,0 80,20 80,140 40,120" fill="#0369A1" />
      <polygon points="40,0 0,20 0,140 40,120" fill="#0284C7" />
      <polygon points="40,0 80,20 40,40 0,20" fill="#38BDF8" />
      <!-- Translucent Data Bands -->
      <line x1="0" y1="50" x2="40" y2="70" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />
      <line x1="40" y1="70" x2="80" y2="50" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />
      <line x1="0" y1="85" x2="40" y2="105" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />
      <line x1="40" y1="105" x2="80" y2="85" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />
      <text x="40" y="95" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SQL</text>
    </g>

    <!-- Real-time Sync Beacon (Right) -->
    <g transform="translate(480, 240)">
      <polygon points="40,0 80,20 80,100 40,80" fill="#047857" opacity="0.9" />
      <polygon points="40,0 0,20 0,100 40,80" fill="#10B981" opacity="0.9" />
      <polygon points="40,0 80,20 40,40 0,20" fill="#34D399" />
      <circle cx="40" cy="50" r="10" fill="#FFFFFF" opacity="0.8" />
      <text x="40" y="75" font-family="monospace" font-size="8" font-weight="bold" fill="#064E3B" text-anchor="middle">REALTIME</text>
    </g>

    <!-- Glowing Supabase Lightning Bolt Crest (Hovering) -->
    <g transform="translate(400, 140)">
      <circle cx="0" cy="0" r="24" fill="#10B981" filter="url(#softGlow4)" />
      <path d="M -6 -14 L 8 -14 L 0 0 L 8 0 L -8 16 L -2 3 L -8 3 Z" fill="#FFFFFF" />
    </g>

    <!-- Query Stream Beams -->
    <path d="M 300 320 L 400 300 L 520 320" stroke="#3ECF8E" stroke-width="4" fill="none" stroke-dasharray="6,4" />
  </g>
</svg>
