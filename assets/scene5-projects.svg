<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="projShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241d2b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#241d2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="projBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D9CC"/>
      <stop offset="100%" stop-color="#C5B8A5"/>
    </linearGradient>
    <linearGradient id="majdoorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="spendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="480" rx="320" ry="90" fill="url(#projShadow)" />

  <g transform="translate(0, -20)">
    <!-- Base Platform -->
    <path d="M 160 380 L 400 490 L 640 380 L 640 410 L 400 520 L 160 410 Z" fill="#B3A48F" />
    <polygon points="400,270 640,380 400,490 160,380" fill="url(#projBase)" />

    <!-- Project 1 Podium: Majdoor Mitra (Left) -->
    <g transform="translate(260, 260)">
      <!-- Pedestal Base -->
      <polygon points="40,0 80,20 80,80 40,60" fill="#B45309" />
      <polygon points="40,0 0,20 0,80 40,60" fill="#D97706" />
      <polygon points="40,0 80,20 40,40 0,20" fill="url(#majdoorGrad)" />
      <!-- Safety Helmet Miniature (Clay Model) -->
      <ellipse cx="40" cy="2" rx="18" ry="12" fill="#FBBF24" />
      <path d="M 22 2 C 22 -14 58 -14 58 2 Z" fill="#F59E0B" />
      <rect x="20" y="0" width="40" height="4" rx="2" fill="#D97706" />
      <!-- Toolbox and Tools -->
      <rect x="15" y="15" width="22" height="14" rx="3" fill="#DC2626" />
      <rect x="22" y="11" width="8" height="4" fill="#991B1B" />
      <text x="40" y="55" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MAJDOOR</text>
    </g>

    <!-- Project 2 Podium: SpendWise (Right) -->
    <g transform="translate(460, 260)">
      <!-- Pedestal Base -->
      <polygon points="40,0 80,20 80,80 40,60" fill="#047857" />
      <polygon points="40,0 0,20 0,80 40,60" fill="#059669" />
      <polygon points="40,0 80,20 40,40 0,20" fill="url(#spendGrad)" />
      <!-- 3D Coin Stacks & Analytics Bar Chart -->
      <g transform="translate(40, -5)">
        <!-- Stack of Gold Coins -->
        <ellipse cx="-15" cy="15" rx="10" ry="5" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.5"/>
        <ellipse cx="-15" cy="10" rx="10" ry="5" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.5"/>
        <ellipse cx="-15" cy="5" rx="10" ry="5" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.5"/>
        <!-- Growth Chart Bars -->
        <rect x="2" y="5" width="6" height="15" rx="2" fill="#34D399" />
        <rect x="12" y="-2" width="6" height="22" rx="2" fill="#10B981" />
        <rect x="22" y="-10" width="6" height="30" rx="2" fill="#059669" />
      </g>
      <text x="40" y="55" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SPENDWISE</text>
    </g>

    <!-- Interactive Center Hologram Ring (Middle) -->
    <g transform="translate(400, 210)">
      <ellipse cx="0" cy="0" rx="45" ry="18" fill="none" stroke="#6366F1" stroke-width="3" opacity="0.8" />
      <ellipse cx="0" cy="0" rx="60" ry="24" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="8,6" opacity="0.7" />
      <!-- Floating Code/Feature Cube -->
      <polygon points="0,-25 20,-15 20,10 0,0" fill="#4338CA" />
      <polygon points="0,-25 -20,-15 -20,10 0,0" fill="#6366F1" />
      <polygon points="0,-25 20,-15 0,-5 -20,-15" fill="#818CF8" />
    </g>

    <!-- Connecting Bridges / Tracks -->
    <path d="M 330 310 Q 400 340 470 310" stroke="#6366F1" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 330 310 Q 400 340 470 310" stroke="#A5B4FC" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
</svg>
